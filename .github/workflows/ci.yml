name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m tokenpace collect --demo > /dev/null

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test and build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tokenpace-debug-apk
          path: android/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the mini window against the demo server
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList '-m','tokenpace','serve','--demo','--port','8799' -PassThru -NoNewWindow
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) { try { $up = (Invoke-RestMethod http://localhost:8799/healthz).ok } catch { Start-Sleep 1 } }
          if (-not $up) { throw "demo server did not start" }
          python -m tokenpace mini --snapshot mini.png --server http://localhost:8799 --expanded
          $code = $LASTEXITCODE
          Stop-Process -Id $srv.Id
          if ($code -ne 0 -or (Get-Item mini.png).Length -lt 10000) { throw "mini snapshot failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: tokenpace-mini
          path: mini.png

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
      - name: Render the mini window against the demo server
        run: |
          python -m tokenpace serve --demo --port 8799 &
          for i in $(seq 30); do curl -fsS http://localhost:8799/healthz && break; sleep 1; done
          python -m tokenpace mini --snapshot mini.png --server http://localhost:8799 --expanded
          test "$(stat -f%z mini.png)" -gt 10000
      - uses: actions/upload-artifact@v4
        with:
          name: tokenpace-mini-macos
          path: mini.png

  linux-tray:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, WebKit, AppIndicator and test displays
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            gir1.2-ayatanaappindicator3-0.1 xvfb openbox xdotool x11-utils imagemagick weston dbus-x11
      - name: Open, focus and close the tray popover on X11 and Wayland
        run: bash .github/linux-tray-check.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokenpace-tray-linux
          path: |
            tray-*.png
            tray-*.log
            weston.log
